name: CI / 持续集成

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate / 质量门禁
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout / 检出代码
        uses: actions/checkout@v6

      - name: Set up Node.js / 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies / 安装依赖
        run: npm ci

      - name: Run quality gate / 执行质量门禁
        run: npm run check

      - name: Run bundled example / 运行自带示例
        run: npm run demo
